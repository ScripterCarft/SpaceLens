[package]
name = "spacelens-win"
description = "Windows-Plattformschicht für SpaceLens: Scanner, Laufwerke, Rechte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
spacelens-core.workspace = true
crossbeam-channel.workspace = true
xxhash-rust.workspace = true

[target.'cfg(windows)'.dependencies]
# COM (IFileOperation for the recycle bin); already in the dependency tree via Slint.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
