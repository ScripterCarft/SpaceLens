# Link the MSVC C runtime statically so SpaceLens.exe runs on any Windows 10/11
# machine without the Visual C++ Redistributable ("portable single exe").
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
